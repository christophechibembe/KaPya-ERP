<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/dashboard-modern-pc.css"><link rel="stylesheet" href="/css/dashboard-modern-mobile.css"><title>Test Tableau de bord</title></head>
<body><div id="root"><div class="shell">
  <nav id="nav" aria-label="Navigation principale"><div class="brand"><span class="bname"><b>KaPya</b><small>ERP</small></span></div><a href="#/accueil" data-r="accueil" aria-current="page"><span>Tableau de bord</span></a><a href="#/vente" data-r="vente"><span>Vente</span></a><a href="#/ventes" data-r="ventes"><span>Historique</span></a><a href="#/stocks" data-r="stocks"><span>Stocks</span></a><a href="#/plus" data-r="plus"><span>Plus</span></a></nav>
  <div class="content"><header class="topbar"><span class="rate-chip">1 $ = 2 800 FC</span><span class="avatar">KT</span></header><main id="main" data-page="accueil" tabindex="-1"></main></div>
</div></div>
<script type="module">
  import { render } from '/js/modules/accueil.js';
  import { fixture, resetDashboard, addSale, addExpense, addPayment } from '/js/api.js';
  import { setMode } from '/js/dashboard-modes.js';
  import { ico } from '/js/ui.js';
  document.querySelectorAll('#nav a').forEach(link => link.insertAdjacentHTML('afterbegin', ico('grid')));
  window.fixture = fixture;
  window.addSale = addSale;
  window.addExpense = addExpense;
  window.addPayment = addPayment;
  window.text = () => document.querySelector('#owner-content')?.textContent || '';
  window.fireSync = () => document.dispatchEvent(new Event('kp:sync'));
  window.waitFor = (needle, timeout = 6000) => new Promise(resolve => {
    const started = Date.now();
    const tick = () => {
      if (window.text().includes(needle)) return resolve(true);
      if (Date.now() - started > timeout) return resolve(false);
      setTimeout(tick, 50);
    };
    tick();
  });
  window.boot = async ({ mode, role = 'admin', blocks = null, period = '7', failTables = [], holdBefore = null } = {}) => {
    fixture.pendingReads.splice(0).forEach(resolve => resolve());
    document.querySelectorAll('dialog[open]').forEach(dialog => dialog.close());
    localStorage.clear();
    resetDashboard();
    fixture.blocks = blocks;
    fixture.failTables = failTables;
    fixture.holdBefore = holdBefore;
    if (mode) setMode(mode, 'dash-user');
    // Une vente normale du jour, puis une vente dont la date contient une heure :
    // les deux doivent compter dans le chiffre d'affaires du jour.
    addSale({ qty: 2, unit: 10 });
    addSale({ qty: 1, unit: 5, soldAt: new Date().toLocaleDateString('sv-SE') + 'T09:30:00' });
    const main = document.querySelector('#main');
    const periodControl = main.querySelector('#owner-period');
    if (periodControl) periodControl.value = period;
    main.dataset.page = 'accueil';
    await render(main, { id: 'dash-user', role });
  };
  window.ready = window.boot();
</script></body></html>
