<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/theme.css"><title>Test Vente rapide</title></head>
<body><div id="root"><div class="shell">
  <nav id="nav" aria-label="Navigation principale"><div class="brand"><span class="bname"><b>KaPya</b><small>ERP</small></span></div><a href="#/accueil">Tableau de bord</a><a href="#/vente" aria-current="page">Vente</a><a href="#/ventes">Historique</a><a href="#/stocks">Stocks</a></nav>
  <div class="content"><header class="topbar"><span class="rate-chip">1 $ = 2 800 FC</span><span class="avatar">KT</span></header><main id="main" data-page="vente" tabindex="-1"></main></div>
</div></div>
<script type="module">
  import { render } from '/js/modules/vente-rapide.js';
  import { fixture, resetFixture } from '/js/api.js';
  window.fixture = fixture;
  window.until = predicate => new Promise(resolve => {
    const observer = new MutationObserver(() => {
      if (predicate()) { observer.disconnect(); resolve(); }
    });
    observer.observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });
    if (predicate()) { observer.disconnect(); resolve(); }
  });
  window.flush = async () => { await Promise.allSettled(fixture.tasks); await new Promise(requestAnimationFrame); };
  window.reopenSale = async () => { await render(document.querySelector('#main'), { role: 'admin' }); await window.flush(); };
  window.resetSale = async (options = {}) => {
    document.querySelectorAll('dialog[open]').forEach(d => d.close());
    localStorage.clear();
    resetFixture(options);
    const cart = fixture.articles.slice(0, options.lines || 0).map(a => ({
      article_id: a.id, name: a.name, price: a.price_sell, qty: options.qty || 1, stock: 100, unit: a.unit, discount: 0
    }));
    if (cart.length) localStorage.setItem('kp.cart.test-user', JSON.stringify(cart));
    const main = document.querySelector('#main');
    main.dataset.page = 'vente';
    await render(main, { role: options.role || 'admin' });
    await window.flush();
  };
  window.ready = window.resetSale();
</script></body></html>
