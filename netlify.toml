[build]
  publish = "."

# Le service worker doit toujours être récupéré depuis le réseau (mises à jour)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fichiers du projet et outils internes : non publics

[[redirects]]
  from = "/sql/*"
  to = "/404.html"
  status = 404

[[redirects]]
