name: Sauvegarde chiffrée

on:
  schedule:
    # Dimanche 02:17 UTC ; indépendant du PC et de la synchronisation OneDrive.
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sauvegarde-production
  cancel-in-progress: false

jobs:
  sauvegarde:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Installer le client PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
      - name: Sauvegarder puis vérifier le déchiffrement
        env:
          KAPYA_SAUVEGARDES: ${{ runner.temp }}/kapya-clair
          KAPYA_COPIE: ${{ runner.temp }}/kapya-chiffre
          KAPYA_DB_URL: ${{ secrets.KAPYA_DB_URL }}
          KAPYA_CLE: ${{ secrets.KAPYA_CLE }}
          KAPYA_WEBHOOK: ${{ secrets.KAPYA_WEBHOOK }}
          PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: |
          test -n "$KAPYA_DB_URL"
          test -n "$KAPYA_CLE"
          test -n "$KAPYA_WEBHOOK"
          node scripts/sauvegarde-production.mjs --garder 8
          node scripts/verifier-copie-chiffree.mjs
      - name: Déposer uniquement les fichiers chiffrés
        uses: actions/upload-artifact@v4
        with:
          name: kapya-sauvegarde-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kapya-chiffre/*.sql.enc
            ${{ runner.temp }}/kapya-chiffre/manifest.json
          if-no-files-found: error
          retention-days: 56
          compression-level: 0
          overwrite: true
      - name: Conserver les huit dernières sauvegardes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/rotation-sauvegardes-cloud.mjs
      - name: Confirmer ou alerter
        if: ${{ always() }}
        env:
          KAPYA_WEBHOOK: ${{ secrets.KAPYA_WEBHOOK }}
          KAPYA_RESULTAT: ${{ job.status }}
        run: node scripts/notifier-sauvegarde-cloud.mjs
      - name: Effacer les fichiers temporaires du runner
        if: ${{ always() }}
        run: |
          rm -rf -- "${{ runner.temp }}/kapya-clair" "${{ runner.temp }}/kapya-chiffre"
